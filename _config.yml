resume_header_intro: "<p>I’m a recent graduate with a research focus on vision language models and their applications in medical imaging. During my final year, I worked as a research intern at Nepal Applied Mathematics and Informatics Institute for Research (NAAMII), where I explored computer vision and multimodal learning for healthcare. Currently, I’m investigating how vision language models can be used to improve organ segmentation in CT scans. I am also a founding engineer at Fizanto where i work on developing AI products in the fintech space from ground up. I’m actively seeking a research assistant position where I can contribute to and grow in the field of computer vision and vision language models.</p>"

